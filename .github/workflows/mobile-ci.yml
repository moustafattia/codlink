name: Android CI

on:
  pull_request:
    paths:
      - 'Makefile'
      - '.gitmodules'
      - 'apps/android/**'
      - 'patches/codex/**'
      - 'shared/rust-bridge/**'
      - 'shared/third_party/codex/**'
      - 'tools/scripts/**'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'Makefile'
      - '.gitmodules'
      - 'apps/android/**'
      - 'patches/codex/**'
      - 'shared/rust-bridge/**'
      - 'shared/third_party/codex/**'
      - 'tools/scripts/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.14904198"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev clang cmake meson ninja-build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/rust-bridge/target
          key: cargo-${{ runner.os }}-${{ hashFiles('shared/rust-bridge/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Sync codex submodule
        run: ./tools/scripts/sync-codex.sh --preserve-current

      - name: Restore generated kotlin bindings cache
        id: kotlin-bindings-cache
        uses: actions/cache@v4
        with:
          path: |
            shared/rust-bridge/generated/kotlin
          key: kotlin-bindings-${{ runner.os }}-${{ hashFiles('tools/scripts/sync-codex.sh', 'shared/rust-bridge/generate-bindings.sh', 'shared/rust-bridge/Cargo.toml', 'shared/rust-bridge/Cargo.lock', 'shared/rust-bridge/codex-mobile-client/src/**', 'shared/rust-bridge/uniffi-bindgen/**', 'patches/codex/**', 'shared/third_party/codex/codex-rs/app-server-protocol/src/protocol/**', 'shared/third_party/codex/codex-rs/protocol/src/**') }}

      - name: Generate Kotlin bindings
        if: steps.kotlin-bindings-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cd shared/rust-bridge
          ./generate-bindings.sh

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI libs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
        run: |
          mkdir -p .build-stamps
          touch .build-stamps/sync .build-stamps/bindings-kotlin
          make rust-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: apps/android/gradlew -p apps/android :app:testDebugUnitTest

      - name: Assemble debug
        run: apps/android/gradlew -p apps/android :app:assembleDebug
