name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;30.0.14904198"

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libcap-dev clang cmake meson ninja-build

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/rust-bridge/target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('shared/rust-bridge/Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Sync codex submodule
        run: ./tools/scripts/sync-codex.sh --preserve-current

      - name: Restore generated kotlin bindings cache
        id: kotlin-bindings-cache
        uses: actions/cache@v4
        with:
          path: |
            shared/rust-bridge/generated/kotlin
          key: kotlin-bindings-release-${{ runner.os }}-${{ hashFiles('tools/scripts/sync-codex.sh', 'shared/rust-bridge/generate-bindings.sh', 'shared/rust-bridge/Cargo.toml', 'shared/rust-bridge/Cargo.lock', 'shared/rust-bridge/codex-mobile-client/src/**', 'shared/rust-bridge/uniffi-bindgen/**', 'patches/codex/**', 'shared/third_party/codex/codex-rs/app-server-protocol/src/protocol/**', 'shared/third_party/codex/codex-rs/protocol/src/**') }}

      - name: Generate Kotlin bindings
        if: steps.kotlin-bindings-cache.outputs.cache-hit != 'true'
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cd shared/rust-bridge
          ./generate-bindings.sh

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust JNI libs
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
          CARGO_BUILD_JOBS: "2"
        run: |
          mkdir -p .build-stamps
          touch .build-stamps/sync .build-stamps/bindings-kotlin
          ANDROID_ABIS="arm64-v8a,x86_64" ANDROID_RUST_PROFILE="release" ./tools/scripts/build-android-rust.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "${ANDROID_UPLOAD_KEYSTORE_B64:-}" ]; then
            echo "Missing secret ANDROID_UPLOAD_KEYSTORE_B64 — building unsigned release"
            exit 0
          fi
          store_file="$RUNNER_TEMP/codlink-upload.jks"
          echo "$ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$store_file"
          echo "CODLINK_UPLOAD_STORE_FILE=$store_file" >> "$GITHUB_ENV"
          ls -lh "$store_file"

      - name: Build release APK
        env:
          CODLINK_UPLOAD_STORE_FILE: ${{ env.CODLINK_UPLOAD_STORE_FILE }}
          CODLINK_UPLOAD_STORE_PASSWORD: ${{ secrets.CODLINK_UPLOAD_STORE_PASSWORD }}
          CODLINK_UPLOAD_KEY_ALIAS: ${{ secrets.CODLINK_UPLOAD_KEY_ALIAS }}
          CODLINK_UPLOAD_KEY_PASSWORD: ${{ secrets.CODLINK_UPLOAD_KEY_PASSWORD }}
        run: apps/android/gradlew -p apps/android :app:assembleRelease

      - name: Generate checksums
        run: |
          APK_PATH="apps/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            APK_PATH="apps/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          sha256sum "$APK_PATH" > "${APK_PATH}.sha256"
          echo "RELEASE_APK=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload build artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            apps/android/app/build/outputs/apk/release/app-release*.apk
            apps/android/app/build/outputs/apk/release/app-release*.apk.sha256

      - name: Publish GitHub Release (tag runs)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/android/app/build/outputs/apk/release/app-release*.apk
            apps/android/app/build/outputs/apk/release/app-release*.apk.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
